<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MILVEXA Pilot Animation | How a Charging Reward Pilot Could Work</title>
<meta name="description" content="An illustrative walk-through of a possible MILVEXA EV charging rewards pilot. No operator, tariff, or reward terms are confirmed.">
<style>
:root{--bg:#dcebf3;--panel:#f4f9fc;--ink:#12303f;--road:#2b3a47;--car:#f2b134;--glass:#bfe0ee;--acc:#0e9f8a;--paper:#fffdf5;--muted:#4b6676;--hill:#c5e3d6;--sun:#ffd36b;--cloud:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2230;--panel:#16303f;--ink:#e8f3f8;--road:#0a1822;--glass:#2c5468;--paper:#f3efe2;--muted:#9fbccb;--hill:#1d4658;--sun:#e8c25a;--cloud:#2c4b5c}}
:root[data-theme="dark"]{--bg:#0f2230;--panel:#16303f;--ink:#e8f3f8;--road:#0a1822;--glass:#2c5468;--paper:#f3efe2;--muted:#9fbccb;--hill:#1d4658;--sun:#e8c25a;--cloud:#2c4b5c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px 16px}
main{width:100%;max-width:520px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand svg{width:38px;height:38px}
.brand b{font-size:1.2rem;font-weight:800;letter-spacing:.02em}
h1{font-size:1.45rem;line-height:1.2;margin:4px 0 14px;font-weight:800}
.stage{background:var(--panel);border-radius:20px;overflow:hidden}
.scene{display:none;width:100%;height:auto}
.scene.on{display:block}
#cap{font-size:1.15rem;font-weight:700;margin:16px 2px 8px;min-height:3.2em;line-height:1.35}
.dots{display:flex;gap:8px;margin:4px 2px 14px}
.dots button{width:28px;height:8px;border:0;border-radius:4px;background:var(--muted);opacity:.35;cursor:pointer;padding:0}
.dots button[aria-current="true"]{opacity:1;background:var(--acc)}
.dots button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.note{font-size:.85rem;color:var(--muted);margin:0}
text{font-family:inherit;fill:var(--ink)}
@keyframes drive{from{transform:translateX(-260px)}to{transform:translateX(0)}}
@keyframes draw{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes flash{0%,55%{opacity:0}65%{opacity:.9}100%{opacity:0}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
@keyframes road{from{transform:translateX(0)}to{transform:translateX(-60px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.cloud{animation:drift 14s ease-in-out infinite alternate}
.on .car{animation:drive 1.8s cubic-bezier(.2,.7,.3,1) both}
.on .cable{stroke-dasharray:120;animation:draw 1s ease-out .3s both}
.on .bar{transform-box:fill-box;transform-origin:left;animation:fill 2.6s ease-in-out .5s both}
.on .receipt{animation:rise 1s ease-out both}
.on .flash{animation:flash 2.2s ease-out .9s both}
.on .check{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) .4s both}
.on .coin{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.3,1.6,.5,1) 1s both}
.on .chip{animation:rise .6s ease-out .8s both}
.on .bolt{animation:pulse 1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.on *,.cloud{animation:none!important}}
</style>
</head>
<body>
<main>
<div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><use href="#logo"/></svg><b>MILVEXA</b></div>
<h1>How a pilot could work</h1>

<symbol id="car" viewBox="0 0 120 56"><path d="M6 36Q6 24 20 22L38 8Q42 5 48 5H80Q86 5 90 9L102 22Q114 24 114 36V42H6Z" fill="var(--car)"/><path d="M44 10H78L88 22H36Z" fill="var(--glass)"/><path d="M63 10V22" stroke="var(--car)" stroke-width="2"/><rect x="108" y="28" width="7" height="5" rx="2" fill="var(--paper)"/><rect x="5" y="30" width="6" height="5" rx="2" fill="#e5544b"/><circle cx="30" cy="44" r="9" fill="var(--ink)"/><circle cx="92" cy="44" r="9" fill="var(--ink)"/><circle cx="30" cy="44" r="3.5" fill="var(--panel)"/><circle cx="92" cy="44" r="3.5" fill="var(--panel)"/></symbol>

<symbol id="phone" viewBox="0 0 90 170"><rect x="1" y="1" width="88" height="168" rx="14" fill="var(--ink)"/><rect x="7" y="12" width="76" height="146" rx="8" fill="var(--panel)"/><rect x="34" y="5" width="22" height="3" rx="1.5" fill="var(--muted)"/></symbol>
<g id="env"><circle cx="64" cy="44" r="20" fill="var(--sun)"/><g class="cloud"><ellipse cx="250" cy="46" rx="26" ry="9" fill="var(--cloud)"/><ellipse cx="268" cy="40" rx="16" ry="9" fill="var(--cloud)"/></g><g class="cloud" style="animation-duration:19s"><ellipse cx="150" cy="30" rx="18" ry="6" fill="var(--cloud)"/></g><path d="M0 150Q70 100 150 140T300 128T400 146V178H0Z" fill="var(--hill)"/><rect y="176" width="400" height="44" fill="var(--road)"/><g fill="var(--paper)" opacity=".7"><rect x="20" y="204" width="30" height="4" rx="2"/><rect x="110" y="204" width="30" height="4" rx="2"/><rect x="200" y="204" width="30" height="4" rx="2"/><rect x="290" y="204" width="30" height="4" rx="2"/></g><g><rect x="338" y="132" width="5" height="44" fill="#8a6a4a"/><circle cx="340" cy="124" r="14" fill="#4a9a6a"/><rect x="26" y="146" width="4" height="30" fill="#8a6a4a"/><circle cx="28" cy="140" r="11" fill="#4a9a6a"/></g></g>
</defs></svg>

<div class="stage" role="img" aria-label="Illustration: you charge your car, scan the receipt and submit it to the MILVEXA pilot">

<svg class="scene on" viewBox="0 0 400 220"><use href="#env"/><use href="#station" x="310" y="66" width="40" height="110"/><svg x="318" y="52" width="24" height="24" viewBox="0 0 40 40"><use href="#logo"/></svg><use class="car" href="#car" x="150" y="122" width="120" height="56"/></svg>

<svg class="scene" viewBox="0 0 400 220"><use href="#env"/><use href="#station" x="310" y="66" width="40" height="110"/><use href="#car" x="150" y="122" width="120" height="56"/>
<path class="cable" d="M312 112C290 112 292 152 268 152" fill="none" stroke="var(--acc)" stroke-width="5" stroke-linecap="round"/>
<circle r="3.5" fill="var(--paper)"><animateMotion dur=".9s" repeatCount="indefinite" path="M312 112C290 112 292 152 268 152"/></circle>
<rect x="120" y="58" width="160" height="28" rx="8" fill="var(--panel)" stroke="var(--ink)" stroke-width="3"/><rect class="bar" x="124" y="62" width="152" height="20" rx="5" fill="var(--acc)"/>
<text id="pct" x="200" y="108" font-size="14" font-weight="800" text-anchor="middle">0%</text></svg>

<svg class="scene" viewBox="0 0 400 220"><rect width="400" height="220" fill="var(--panel)"/><g class="receipt"><path d="M60 34h92v146l-8-5-8 5-8-5-8 5-8-5-8 5-8-5-8 5-8-5-8 5-4-3z" fill="var(--paper)"/><text x="106" y="52" font-size="9" font-weight="800" text-anchor="middle" style="fill:#12303f">SAMPLE RECEIPT</text><rect x="72" y="62" width="68" height="3" rx="1.5" fill="#4b6676" opacity=".5"/><text x="72" y="84" font-size="7.5" style="fill:#12303f">Energy</text><text x="140" y="84" font-size="7.5" text-anchor="end" style="fill:#12303f">24.6 kWh</text><text x="72" y="100" font-size="7.5" style="fill:#12303f">Price</text><text x="140" y="100" font-size="7.5" text-anchor="end" style="fill:#12303f">Example</text><rect x="72" y="110" width="68" height="3" rx="1.5" fill="#4b6676" opacity=".5"/><text x="72" y="130" font-size="9" font-weight="800" style="fill:#12303f">Total</text><text x="140" y="130" font-size="9" font-weight="800" text-anchor="end" style="fill:#12303f">—</text><g fill="#12303f"><rect x="72" y="146" width="3" height="18"/><rect x="78" y="146" width="1.5" height="18"/><rect x="82" y="146" width="4" height="18"/><rect x="90" y="146" width="2" height="18"/><rect x="95" y="146" width="3" height="18"/><rect x="101" y="146" width="1.5" height="18"/><rect x="106" y="146" width="4" height="18"/><rect x="114" y="146" width="2" height="18"/><rect x="119" y="146" width="3" height="18"/><rect x="126" y="146" width="2" height="18"/><rect x="131" y="146" width="3" height="18"/></g></g>
<use href="#phone" x="220" y="24" width="90" height="170"/><svg x="248" y="40" width="34" height="34" viewBox="0 0 40 40"><use href="#logo"/></svg><text x="265" y="92" font-size="7.5" font-weight="700" text-anchor="middle">Scan your receipt</text><g fill="none" stroke="var(--acc)" stroke-width="4" stroke-linecap="round"><path d="M236 104v-8h8"/><path d="M294 104v-8h-8"/><path d="M236 156v8h8"/><path d="M294 156v8h-8"/></g><rect x="244" y="112" width="42" height="32" rx="3" fill="var(--paper)" opacity=".85"/><rect class="flash" x="227" y="36" width="76" height="146" rx="8" fill="#fff" opacity="0"/></svg>

<svg class="scene" viewBox="0 0 400 220"><rect width="400" height="220" fill="var(--panel)"/><use href="#phone" x="130" y="24" width="90" height="170"/><svg x="157" y="38" width="36" height="36" viewBox="0 0 40 40"><use href="#logo"/></svg><g class="check"><circle cx="175" cy="102" r="20" fill="var(--acc)"/><path d="M165 102l8 8 13-15" fill="none" stroke="var(--paper)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="175" y="146" font-size="8.5" font-weight="700" text-anchor="middle">Receipt submitted</text><text x="175" y="160" font-size="7" text-anchor="middle" style="fill:var(--muted)">If approved, reward is sent in MVXA</text>
<g class="chip"><rect x="244" y="70" width="112" height="34" rx="17" fill="var(--car)"/><text x="300" y="91" font-size="10" font-weight="800" text-anchor="middle" style="fill:#12303f">Reward in MVXA</text></g>
<g class="coin"><circle cx="300" cy="140" r="26" fill="#04060d" stroke="var(--car)" stroke-width="4"/><svg x="284" y="124" width="32" height="32" viewBox="0 0 40 40"><use href="#logo"/></svg></g></svg>

</div>
<p id="cap" aria-live="polite"></p>
<div class="dots" id="dots"></div>
<p class="note">Concept illustration only. Receipt figures are fictional; no operator, tariff, or reward terms are confirmed.</p>
</main>
<script>
(function(){
var scenes=document.querySelectorAll('.scene'),cap=document.getElementById('cap'),dots=document.getElementById('dots'),pct=document.getElementById('pct'),i=0,timer,raf;
var text=['You pull up to a charging station.','Your car charges.','You photograph the receipt with your phone.','You submit it to the pilot. After review, an approved submission may receive a capped MVXA reward.'];
var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches,btns=[];
text.forEach(function(_,n){var b=document.createElement('button');b.setAttribute('aria-label','Step '+(n+1));b.onclick=function(){show(n);restart()};dots.appendChild(b);btns.push(b)});
function count(){cancelAnimationFrame(raf);if(still){pct.textContent='100%';return}var t0=performance.now();(function f(t){var p=Math.min(1,Math.max(0,(t-t0-500)/2600));pct.textContent=Math.round(p*100)+'%';if(p<1)raf=requestAnimationFrame(f)})(t0)}
function show(n){i=n;scenes.forEach(function(s,k){s.classList.remove('on');if(k===n){void s.getBoundingClientRect();s.classList.add('on')}});cap.textContent=text[n];btns.forEach(function(b,k){b.setAttribute('aria-current',k===n)});if(n===1)count()}
function restart(){clearInterval(timer);if(!still){timer=setInterval(function(){show((i+1)%scenes.length)},4800)}}
show(0);restart();
})();
</script>
</body>
</html>
